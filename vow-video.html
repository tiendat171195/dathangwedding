<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vow Video — Tiến Đạt & Minh Hằng</title>
  <meta name="description" content="Vow video của Tiến Đạt & Minh Hằng" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+Display:opsz,wght@8..144,500;8..144,600;8..144,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --text: #111;
      --border: #e5e7eb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      opacity: 0.7;
      transition: opacity 0.3s;
    }

    .back-link:hover {
      opacity: 1;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    h1 {
      font-family: 'Noto Serif Display', Georgia, serif;
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
    }

    .subtitle {
      font-size: 16px;
      opacity: 0.7;
      margin-bottom: 40px;
      text-align: center;
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 1000px;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      background: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 16px;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 28px;
      }

      .main {
        padding: 24px 16px;
      }

      .video-container {
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Quay lại trang chủ
    </a>
  </header>

  <main class="main">
    <h1>Vow Video</h1>
    <p class="subtitle">Tiến Đạt & Minh Hằng</p>

    <div class="video-container">
      <iframe
        src="https://drive.google.com/file/d/1X59tLLkVcn9aolnGJkwXhY3qBrz_U6k5/preview"
        allowfullscreen>
      </iframe>
    </div>
  </main>
</body>
</html>
